name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace -PappVersionCode=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: atomic-habits-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Signed release build for store distribution (RuStore). Entirely optional -
      # if RELEASE_KEYSTORE_BASE64 isn't set as a repo secret, these steps just
      # skip and the debug build above is unaffected. See docs/SETUP_RUSTORE.md.
      - name: Check whether release signing is configured
        id: release_check
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release keystore
        if: steps.release_check.outputs.configured == 'true'
        run: echo '${{ secrets.RELEASE_KEYSTORE_BASE64 }}' | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        if: steps.release_check.outputs.configured == 'true'
        run: >
          gradle assembleRelease --stacktrace
          -PappVersionCode=${{ github.run_number }}
          -PreleaseKeystorePath=${{ runner.temp }}/release.keystore
          -PreleaseKeystorePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          -PreleaseKeyAlias=${{ secrets.RELEASE_KEY_ALIAS }}

      - name: Upload release APK artifact
        if: steps.release_check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atomic-habits-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Only publish a Release on an actual push to main (not on pull requests) -
      # this is what the in-app updater checks and downloads from, since Release
      # assets have plain public download URLs (unlike Actions artifacts, which
      # require an authenticated API call even for public repos).
      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Auto-deploys firestore.rules to your Firebase project via the Firebase CLI,
  # so editing the rules file and pushing to GitHub is enough - no manual step
  # in the Firebase console needed. Entirely optional: if FIREBASE_SERVICE_ACCOUNT
  # isn't set as a repo secret, this job just skips its steps and does nothing.
  # See docs/SETUP_FIREBASE.md for the one-time setup.
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      FIREBASE_PROJECT_ID: atomic-habits-17a37
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether Firebase deploy is configured
        id: check
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write service account key
        if: steps.check.outputs.configured == 'true'
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-service-account.json

      - name: Deploy Firestore rules
        if: steps.check.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json
        run: >
          npx firebase-tools@latest deploy
          --only firestore:rules
          --project "$FIREBASE_PROJECT_ID"
          --non-interactive
