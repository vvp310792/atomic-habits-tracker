name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: >
          gradle assembleDebug --stacktrace
          -PappVersionCode=${{ github.run_number }}
          -PsheetsWebAppUrl="${{ secrets.SHEETS_WEBAPP_URL }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: atomic-habits-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Only publish a Release on an actual push to main (not on pull requests) -
      # this is what the in-app updater checks and downloads from, since Release
      # assets have plain public download URLs (unlike Actions artifacts, which
      # require an authenticated API call even for public repos).
      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Auto-deploys apps-script/HabitSheetSync.gs to your existing Apps Script
  # project via clasp, so editing the .gs file and pushing to GitHub is enough -
  # no manual copy-paste into the Apps Script editor needed. Entirely optional:
  # if CLASP_CREDENTIALS / APPS_SCRIPT_ID aren't set as repo secrets, this job
  # just skips its steps and does nothing. See docs/SETUP_GOOGLE_SHEETS.md for
  # the one-time setup (requires logging clasp into your Google account locally
  # once - this can't be done from CI itself).
  deploy-apps-script:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether clasp is configured
        id: check
        run: |
          if [ -n "${{ secrets.CLASP_CREDENTIALS }}" ] && [ -n "${{ secrets.APPS_SCRIPT_ID }}" ] && [ -n "${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        if: steps.check.outputs.configured == 'true'
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        if: steps.check.outputs.configured == 'true'
        run: echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Write .clasp.json
        if: steps.check.outputs.configured == 'true'
        working-directory: apps-script
        run: echo "{\"scriptId\":\"${{ secrets.APPS_SCRIPT_ID }}\",\"rootDir\":\".\"}" > .clasp.json

      - name: Push script source
        if: steps.check.outputs.configured == 'true'
        working-directory: apps-script
        run: clasp push -f

      - name: Deploy new version (keeps the same /exec URL)
        if: steps.check.outputs.configured == 'true'
        working-directory: apps-script
        run: >
          clasp deploy
          --deploymentId "${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}"
          --description "Auto-deploy build ${{ github.run_number }}"
